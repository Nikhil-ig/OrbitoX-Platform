version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbitox_postgres
    environment:
      POSTGRES_USER: orbitox_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: orbitox
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitox_admin -d orbitox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orbitox_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
