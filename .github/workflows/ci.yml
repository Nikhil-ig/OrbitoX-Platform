name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test & smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbitox
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orbitox/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace packages
        run: pnpm exec turbo run build --filter='web^...'

      - name: Type-check control plane
        run: pnpm --filter web exec tsc --noEmit

      - name: Unit tests
        run: pnpm --filter @orbitox/external-project-engine test

      - name: Build control plane
        run: pnpm --filter web exec next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Smoke test against the production server
        run: |
          export ORBITOX_ADMIN_TOKEN="$(openssl rand -hex 32)"
          export ORBITOX_RUNTIME_TOKEN="$(openssl rand -hex 32)"
          export ORBITOX_CONTROL_SECRET="$(openssl rand -hex 32)"
          export ORBITOX_GUEST_SECRET="$(openssl rand -hex 32)"
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          NODE_ENV=production PORT=3005 HOSTNAME=127.0.0.1 ORBITOX_DATA_DIR="$RUNNER_TEMP/orbitox-data" \
            node apps/web/.next/standalone/apps/web/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3005/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          ORBITOX_URL=http://127.0.0.1:3005 node scripts/smoke-control-plane.mjs || { cat "$RUNNER_TEMP/server.log"; exit 1; }

  pack-and-verify:
    name: Package Tarball & External Install Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orbitox
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orbitox/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pack packages, install into clean isolated temp dir, and verify
        run: bash scripts/pack-and-verify.sh

  secret-scan:
    name: Secret scan (working tree)
    runs-on: ubuntu-latest
    # Non-blocking until git history is purged of the secrets that were committed
    # before this cleanup (see docs/SECURITY_CLEANUP.md). Then remove continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Scan files for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest dir /repo --no-banner --redact --verbose

  restaurantos-e2e:
    name: RestaurantOS HTTP Multi-Tenant & RLS Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restaurant_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: projects/external-os/restaurant-os
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/external-os/restaurant-os/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Push DB Schema
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os

      - name: Setup PostgreSQL RLS & App Role
        run: pnpm exec tsx scripts/setup-postgres-rls.ts
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os
          APP_DB_PASSWORD: test_app_pass_123

      - name: Type-check RestaurantOS
        run: pnpm exec tsc --noEmit

      - name: Tenant Staff Auth Suite (Item 1)
        run: pnpm exec tsx scripts/test-tenant-staff-auth.ts
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os

      - name: Safe Tenancy & Kernel RLS Suite (Item 2)
        run: pnpm exec tsx scripts/test-safe-tenancy-and-rls.ts
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os
          APP_DATABASE_URL: postgresql://restaurantos_app:test_app_pass_123@127.0.0.1:5432/restaurant_os

      - name: Owner Self-Service & Branding Suite (Item 4)
        run: pnpm exec tsx scripts/test-owner-self-service.ts
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os

      - name: Custom Domains & SSL Verification Suite
        run: pnpm exec tsx scripts/test-custom-domains.ts
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os

      - name: Black-Box HTTP Multi-Tenant Suite (Item 3)
        run: pnpm exec tsx scripts/test-e2e-http-multitenancy.ts
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os
          APP_DATABASE_URL: postgresql://restaurantos_app:test_app_pass_123@127.0.0.1:5432/restaurant_os

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [build, restaurantos-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build control plane image
        uses: docker/build-push-action@v6
        with:
          context: orbitox
          file: orbitox/apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build RestaurantOS runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/external-os/restaurant-os/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
