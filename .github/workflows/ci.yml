name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test & smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbitox_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: orbitox
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orbitox/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply control-plane baseline and configure runtime roles
        run: |
          pnpm exec prisma generate --schema prisma/schema.prisma
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          PGPASSWORD=postgrespassword psql "$DATABASE_URL" -v app_role_password="$APP_DB_PASSWORD" -v maintenance_role_password="$MAINTENANCE_DB_PASSWORD" -v platform_admin_audit_password="$PLATFORM_ADMIN_AUDIT_DB_PASSWORD" -f scripts/configure-step1-runtime-role.sql
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_smoke
          APP_DB_PASSWORD: phase2-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          MAINTENANCE_DB_PASSWORD: phase2-maint-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          PLATFORM_ADMIN_AUDIT_DB_PASSWORD: phase2-audit-smoke-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build workspace packages
        run: pnpm exec turbo run build --filter='web^...'

      - name: Type-check monorepo packages & control plane
        run: pnpm exec turbo run type-check

      - name: Unit tests (Core, Plugin Engine, POS, CRM, External Project Engine)
        run: |
          pnpm --filter @orbitox/core test
          pnpm --filter @orbitox/plugin-engine test
          pnpm --filter @orbitox/pos test
          pnpm --filter @orbitox/crm test
          pnpm --filter @orbitox/external-project-engine test

      - name: Build control plane
        run: pnpm --filter web exec next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Smoke test against the production server
        run: |
          export ORBITOX_ADMIN_TOKEN="$(openssl rand -hex 32)"
          export ORBITOX_RUNTIME_TOKEN="$(openssl rand -hex 32)"
          export ORBITOX_CONTROL_SECRET="$(openssl rand -hex 32)"
          export ORBITOX_GUEST_SECRET="$(openssl rand -hex 32)"
          export ORBITOX_SERVER_PEPPER="$(openssl rand -hex 32)"
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          NODE_ENV=production PORT=3005 HOSTNAME=127.0.0.1 ORBITOX_DATA_DIR="$RUNNER_TEMP/orbitox-data" \
            node apps/web/.next/standalone/apps/web/server.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3005/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          ORBITOX_URL=http://127.0.0.1:3005 node scripts/smoke-control-plane.mjs || { cat "$RUNNER_TEMP/server.log"; exit 1; }
        env:
          DATABASE_URL: postgresql://orbitox_runtime:phase2-smoke-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_smoke
          APP_DATABASE_URL: postgresql://orbitox_runtime:phase2-smoke-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_smoke
          PLATFORM_AUDIT_DATABASE_URL: postgresql://orbitox_platform_admin_audit:phase2-audit-smoke-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_smoke

  pack-and-verify:
    name: Package Tarball & External Install Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: orbitox
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orbitox/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Pack packages, install into clean isolated temp dir, and verify
        run: bash scripts/pack-and-verify.sh
      - name: Scaffold & Multi-Template End-to-End Smoke Test
        run: pnpm exec tsx scripts/test-scaffold-smoke.ts

  secret-scan:
    name: Secret scan (working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan files for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 dir /repo --config=/repo/.gitleaks.toml --no-banner --redact --verbose

  restaurantos-e2e:
    name: RestaurantOS HTTP Multi-Tenant & RLS Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: restaurant_os
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: projects/external-os/restaurant-os
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: projects/external-os/restaurant-os/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build linked OrbitoX external-runtime-sdk
        working-directory: orbitox
        run: |
          pnpm install --frozen-lockfile --filter @orbitox/external-runtime-sdk... --filter @orbitox/pos... --filter @orbitox/plugin-engine...
          pnpm --filter @orbitox/external-runtime-sdk... --filter @orbitox/pos... --filter @orbitox/plugin-engine... run build

      - name: Generate Prisma Client & Push DB Schema
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os

      - name: Setup PostgreSQL RLS & App Role
        run: pnpm exec tsx scripts/setup-postgres-rls.ts
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os
          APP_DB_PASSWORD: test_app_pass_123

      - name: Type-check RestaurantOS
        run: pnpm exec tsc --noEmit

      - name: RestaurantOS Core & Event Bus Tests (P0.2)
        run: pnpm test

      - name: Tenant Staff Auth Suite (Item 1)
        run: pnpm exec tsx scripts/test-tenant-staff-auth.ts
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os

      - name: Safe Tenancy & Kernel RLS Suite (Item 2)
        run: pnpm exec tsx scripts/test-safe-tenancy-and-rls.ts
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os
          APP_DATABASE_URL: postgresql://restaurantos_app:test_app_pass_123@127.0.0.1:5432/restaurant_os

      - name: Owner Self-Service & Branding Suite (Item 4)
        run: pnpm exec tsx scripts/test-owner-self-service.ts
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os

      - name: Custom Domains & SSL Verification Suite
        run: pnpm exec tsx scripts/test-custom-domains.ts
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os

      - name: Black-Box HTTP Multi-Tenant Suite (Item 3)
        run: pnpm exec tsx scripts/test-e2e-http-multitenancy.ts
        env:
          E2E_P95_LIMIT_MS: "600" # shared GitHub runner; 250ms SLA is checked on dedicated hardware
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os
          APP_DATABASE_URL: postgresql://restaurantos_app:test_app_pass_123@127.0.0.1:5432/restaurant_os

  platform-phase2-step1:
    name: Control Plane PostgreSQL Step 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbitox_phase2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: orbitox
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orbitox/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate Prisma schema and generate client
        run: |
          pnpm exec prisma validate --schema prisma/schema.prisma
          pnpm exec prisma generate --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
      - name: Apply fresh baseline and security migrations twice
        run: |
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
      - name: Verify database has no Prisma schema drift
        run: pnpm exec prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-url "$DATABASE_URL" --exit-code
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
      - name: Configure restricted runtime and maintenance logins
        run: PGPASSWORD=postgrespassword psql "$DATABASE_URL" -v app_role_password="$APP_DB_PASSWORD" -v maintenance_role_password="$MAINTENANCE_DB_PASSWORD" -v platform_admin_audit_password="$PLATFORM_ADMIN_AUDIT_DB_PASSWORD" -f scripts/configure-step1-runtime-role.sql
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          APP_DB_PASSWORD: phase2-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MAINTENANCE_DB_PASSWORD: phase2-maint-${{ github.run_id }}-${{ github.run_attempt }}
          PLATFORM_ADMIN_AUDIT_DB_PASSWORD: phase2-audit-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify RLS, audit immutability, and readiness
        run: pnpm --filter web test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          APP_DATABASE_URL: postgresql://orbitox_runtime:phase2-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          PLATFORM_AUDIT_DATABASE_URL: postgresql://orbitox_platform_admin_audit:phase2-audit-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
      - name: Verify async Prisma repository and authorization query budget
        run: pnpm --filter web test:repository
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          APP_DATABASE_URL: postgresql://orbitox_runtime:phase2-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          PLATFORM_AUDIT_DATABASE_URL: postgresql://orbitox_platform_admin_audit:phase2-audit-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          MAINTENANCE_DATABASE_URL: postgresql://orbitox_maintenance:phase2-maint-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
      - name: Run full web suite against explicit JSON test adapter
        run: pnpm --filter web test
      - name: Run full web suite against PostgreSQL runtime role
        run: pnpm --filter web test:postgres
        env:
          NODE_ENV: test
          ORBITOX_PLATFORM_REPOSITORY: prisma
          ORBITOX_ADMIN_TOKEN: phase2-ci-admin-token-for-web-tests
          ORBITOX_SERVER_PEPPER: phase2-ci-server-pepper-for-web-tests-32
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          APP_DATABASE_URL: postgresql://orbitox_runtime:phase2-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          PLATFORM_AUDIT_DATABASE_URL: postgresql://orbitox_platform_admin_audit:phase2-audit-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          MAINTENANCE_DATABASE_URL: postgresql://orbitox_maintenance:phase2-maint-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
      - name: Verify health fails while PostgreSQL is stopped
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          APP_DATABASE_URL: postgresql://orbitox_runtime:phase2-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          PLATFORM_AUDIT_DATABASE_URL: postgresql://orbitox_platform_admin_audit:phase2-audit-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          ORBITOX_ADMIN_TOKEN: phase2-ci-admin-token-for-outage-test
          ORBITOX_SERVER_PEPPER: phase2-ci-server-pepper-for-outage-test-32
        run: pnpm --filter web test:database-outage

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [build, restaurantos-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build control plane image
        uses: docker/build-push-action@v6
        with:
          context: orbitox
          file: orbitox/apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build RestaurantOS runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/external-os/restaurant-os/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
