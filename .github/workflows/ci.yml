  platform-phase2-step5:
    name: Phase 2 Step 5 JSON Migration & Importer Durability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbitox_phase2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: orbitox
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orbitox/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build workspace packages
        run: pnpm exec turbo run build --filter='web^...'
      - name: Apply all Prisma migrations and configure roles
        run: |
          pnpm exec prisma generate --schema prisma/schema.prisma
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          PGPASSWORD=postgrespassword psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -v app_role_password="$APP_DB_PASSWORD" -v maintenance_role_password="$MAINTENANCE_DB_PASSWORD" -v platform_admin_audit_password="$PLATFORM_ADMIN_AUDIT_DB_PASSWORD" -v hms_audit_reader_password="$HMS_AUDIT_DB_PASSWORD" -v outbox_relay_password="$OUTBOX_RELAY_DB_PASSWORD" -f scripts/configure-step1-runtime-role.sql
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          APP_DB_PASSWORD: phase2-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MAINTENANCE_DB_PASSWORD: phase2-maint-${{ github.run_id }}-${{ github.run_attempt }}
          PLATFORM_ADMIN_AUDIT_DB_PASSWORD: phase2-audit-${{ github.run_id }}-${{ github.run_attempt }}
          HMS_AUDIT_DB_PASSWORD: phase2-auditreader-${{ github.run_id }}-${{ github.run_attempt }}
          OUTBOX_RELAY_DB_PASSWORD: phase2-relay-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Generate per-run account security values
        run: |
          echo "ORBITOX_MFA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "ORBITOX_ACCOUNT_TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          phi_key="$(openssl rand -base64 32)"
          echo "ORBITOX_PHI_KEYS={\"k1\":\"${phi_key}\"}" >> "$GITHUB_ENV"
          echo "ORBITOX_PHI_ACTIVE_KID=k1" >> "$GITHUB_ENV"
          echo "ORBITOX_PHI_INDEX_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "ORBITOX_OPERATOR_INITIAL_PASSWORD=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ORBITOX_ADMIN_TOKEN_SCOPES=GET:/api/*,POST:/api/*,PUT:/api/*,PATCH:/api/*,DELETE:/api/*" >> "$GITHUB_ENV"
          echo "ORBITOX_PUBLIC_BASE_URL=https://console.orbitox.test" >> "$GITHUB_ENV"
          echo "ORBITOX_OPERATOR_INITIAL_EMAIL=ci-startup-owner@example.invalid" >> "$GITHUB_ENV"
          echo "ORBITOX_BREACHED_PASSWORD_API=off" >> "$GITHUB_ENV"
      - name: Bootstrap CI owner through operator:bootstrap
        run: |
          pnpm --filter web operator:bootstrap > "$RUNNER_TEMP/operator-bootstrap.stdout" 2> "$RUNNER_TEMP/operator-bootstrap.stderr" || {
            cat "$RUNNER_TEMP/operator-bootstrap.stderr"
            exit 1
          }
        env:
          MAINTENANCE_DATABASE_URL: postgresql://orbitox_maintenance:phase2-maint-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
      - name: Build Next.js standalone application
        run: |
          ORBITOX_SERVER_PEPPER="$(openssl rand -hex 32)" pnpm --filter web exec next build
          mkdir -p apps/web/.next/standalone/apps/web/.next
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          APP_DATABASE_URL: postgresql://orbitox_runtime:phase2-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          PLATFORM_AUDIT_DATABASE_URL: postgresql://orbitox_platform_admin_audit:phase2-audit-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          HMS_AUDIT_DATABASE_URL: postgresql://hms_audit_reader:phase2-auditreader-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          OUTBOX_RELAY_DATABASE_URL: postgresql://orbitox_outbox_relay:phase2-relay-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
      - name: Run Step 5 JSON Importer, Mid-Transaction Kill -9 & Verification Harness
        run: pnpm --filter web test:step5-import
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          APP_DATABASE_URL: postgresql://orbitox_runtime:phase2-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          PLATFORM_AUDIT_DATABASE_URL: postgresql://orbitox_platform_admin_audit:phase2-audit-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          HMS_AUDIT_DATABASE_URL: postgresql://hms_audit_reader:phase2-auditreader-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          MAINTENANCE_DATABASE_URL: postgresql://orbitox_maintenance:phase2-maint-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          OUTBOX_RELAY_DATABASE_URL: postgresql://orbitox_outbox_relay:phase2-relay-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2

  rds-compatible-migrations:
    name: RDS-Compatible Migration Chain (Non-Superuser)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbitox_staging_sim
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: orbitox
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: orbitox/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build workspace packages
        run: pnpm exec turbo run build --filter='web^...'
      - name: Setup RDS non-superuser admin and simulate RDS master
        run: |
          PGPASSWORD=postgrespassword psql -h 127.0.0.1 -U postgres -d orbitox_staging_sim -c "
            -- Emulate AWS RDS rds_superuser without native SUPERUSER or BYPASSRLS
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rds_superuser') THEN
                CREATE ROLE rds_superuser;
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rds_master') THEN
                CREATE ROLE rds_master WITH LOGIN PASSWORD 'rdsmasterpass' CREATEDB CREATEROLE NOINHERIT;
                GRANT rds_superuser TO rds_master;
              END IF;
            END
            \$\$;
            -- In AWS RDS, the master admin is the owner of the target database
            ALTER DATABASE orbitox_staging_sim OWNER TO rds_master;
          "
      - name: Run RDS bootstrap script as rds_master
        run: |
          PGPASSWORD=rdsmasterpass psql -h 127.0.0.1 -U rds_master -d orbitox_staging_sim \
            -v ON_ERROR_STOP=1 \
            -v migrator_password="migrator_test_password" \
            -f ../scripts/rds-bootstrap-roles.sql
      - name: Run Prisma migrations as orbitox_migrator
        run: |
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://orbitox_migrator:migrator_test_password@127.0.0.1:5432/orbitox_staging_sim
      - name: Run RDS role enable script as orbitox_migrator
        run: |
          PGPASSWORD=migrator_test_password psql -h 127.0.0.1 -U orbitox_migrator -d orbitox_staging_sim \
            -v ON_ERROR_STOP=1 \
            -v runtime_password="app_runtime_test_password" \
            -v maintenance_password="maint_test_password" \
            -v platform_admin_audit_password="audit_test_password" \
            -v hms_audit_reader_password="auditreader_test_password" \
            -v outbox_relay_password="relay_test_password" \
            -f ../scripts/rds-enable-roles.sql
      - name: Run Step 1 Role and RLS inventory under restricted roles
        run: |
          pnpm exec prisma generate --schema prisma/schema.prisma
          node apps/web/scripts/run-staging-inventory.js
        env:
          DATABASE_URL: postgresql://orbitox_migrator:migrator_test_password@127.0.0.1:5432/orbitox_staging_sim
          APP_DATABASE_URL: postgresql://orbitox_runtime:app_runtime_test_password@127.0.0.1:5432/orbitox_staging_sim
          PLATFORM_AUDIT_DATABASE_URL: postgresql://orbitox_platform_admin_audit:audit_test_password@127.0.0.1:5432/orbitox_staging_sim
          HMS_AUDIT_DATABASE_URL: postgresql://hms_audit_reader:auditreader_test_password@127.0.0.1:5432/orbitox_staging_sim
          MAINTENANCE_DATABASE_URL: postgresql://orbitox_maintenance:maint_test_password@127.0.0.1:5432/orbitox_staging_sim
          OUTBOX_RELAY_DATABASE_URL: postgresql://orbitox_outbox_relay:relay_test_password@127.0.0.1:5432/orbitox_staging_sim

  data-rights-6g:
    name: Phase 6G Data Rights (Export, Erasure, DSR & Cross-Tenant Isolation)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbitox_phase2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            orbitox/pnpm-lock.yaml
            projects/external-os/restaurant-os/pnpm-lock.yaml

      - name: Install and build OrbitoX workspace packages
        working-directory: orbitox
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prisma generate --schema prisma/schema.prisma
          pnpm exec turbo run build --filter='web^...'

      - name: Install RestaurantOS dependencies & generate Prisma client
        working-directory: projects/external-os/restaurant-os
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prisma generate

      - name: Deploy OrbitoX & RestaurantOS schemas and configure roles/RLS
        run: |
          PGPASSWORD=postgrespassword psql -h 127.0.0.1 -U postgres -d orbitox_phase2 -c "CREATE DATABASE restaurant_os;"
          (
            cd orbitox
            pnpm exec prisma migrate deploy --schema prisma/schema.prisma
            pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
            PGPASSWORD=postgrespassword psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -v app_role_password="$APP_DB_PASSWORD" \
              -v maintenance_role_password="$MAINTENANCE_DB_PASSWORD" \
              -v platform_admin_audit_password="$PLATFORM_ADMIN_AUDIT_DB_PASSWORD" \
              -v hms_audit_reader_password="$HMS_AUDIT_DB_PASSWORD" \
              -v outbox_relay_password="$OUTBOX_RELAY_DB_PASSWORD" \
              -f scripts/configure-step1-runtime-role.sql
          )
          (
            cd projects/external-os/restaurant-os
            DATABASE_URL="$RESTAURANT_OS_DATABASE_URL" pnpm exec prisma migrate deploy
            DATABASE_URL="$RESTAURANT_OS_DATABASE_URL" APP_DB_PASSWORD="$REST_APP_DB_PASSWORD" pnpm exec tsx scripts/setup-postgres-rls.ts
          )
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          RESTAURANT_OS_DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os
          APP_DB_PASSWORD: phase2-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MAINTENANCE_DB_PASSWORD: phase2-maint-${{ github.run_id }}-${{ github.run_attempt }}
          PLATFORM_ADMIN_AUDIT_DB_PASSWORD: phase2-audit-${{ github.run_id }}-${{ github.run_attempt }}
          HMS_AUDIT_DB_PASSWORD: phase2-auditreader-${{ github.run_id }}-${{ github.run_attempt }}
          OUTBOX_RELAY_DB_PASSWORD: phase2-relay-${{ github.run_id }}-${{ github.run_attempt }}
          REST_APP_DB_PASSWORD: test_app_pass_123

      - name: Run Phase 6G Data Rights Integration Suite (G1-G5)
        working-directory: orbitox
        run: |
          (cd ../projects/external-os/restaurant-os && pnpm exec tsx --test test/data-rights-model-coverage.test.ts)
          pnpm --filter web test:data-rights-6g
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          TEST_DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/orbitox_phase2
          APP_DATABASE_URL: postgresql://orbitox_runtime:phase2-ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          MAINTENANCE_DATABASE_URL: postgresql://orbitox_maintenance:phase2-maint-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          PLATFORM_AUDIT_DATABASE_URL: postgresql://orbitox_platform_admin_audit:phase2-audit-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          HMS_AUDIT_DATABASE_URL: postgresql://hms_audit_reader:phase2-auditreader-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/orbitox_phase2
          RESTAURANT_OS_DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/restaurant_os
          RESTAURANT_OS_APP_DATABASE_URL: postgresql://restaurantos_app:test_app_pass_123@127.0.0.1:5432/restaurant_os
          ORBITOX_EXPORT_MANIFEST_OUT: ${{ runner.temp }}/6g-export-manifest.json

      - name: Upload Phase 6G export manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-6g-export-manifest
          path: ${{ runner.temp }}/6g-export-manifest.json
          if-no-files-found: error

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    needs:
      [
        build,
        restaurantos-e2e,
        restaurantos-phase2b4,
        platform-phase2-step3,
        platform-phase2-step4,
        platform-phase2-step5,
        rds-compatible-migrations,
        data-rights-6g,
      ]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build control plane image
        uses: docker/build-push-action@v6
        with:
          context: orbitox
          file: orbitox/apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build RestaurantOS runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projects/external-os/restaurant-os/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
