# OrbitoX Platform Gitleaks Security Scan Configuration
# Scanner Version: zricethezav/gitleaks:v8.21.2
#
# Release Compliance Policy:
# - Zero blanket directory exclusions (docs/, B2B2C_Template_Docs/, scripts/, snapshots/ are NOT excluded).
# - Zero blanket file extension exclusions (*.md, *.spec.ts, *.test.ts are NOT excluded).
# - All documentation, architecture specifications, source packages, and workflows are actively scanned.
# - Allowlist is strictly confined to individually justified test fixtures verifying security redaction/masking algorithms.

[extend]
useDefault = true

[allowlist]
description = "Individually justified test fixtures for security masking/redaction algorithms and local gitignored dev caches"
regexes = [
  # S5-4: Value-specific allowlists for synthetic test vectors and markers (never allowlist entire files by path)
  '''(?i)orb_test_.*''',
  '''DISCARDED_UNVERIFIED_LEGACY_KEY''',
  '''key_live_omni_verified_12345''',
  '''key_live_mednet_unverified_67890''',
  '''__orbitox_preflight_vector__''',
  '''stn_sec_tandoor_ldh_99x7''',
  '''e3fd2fa74174360f0984a7b9c9cd04e4059d3e57'''
]
paths = [
  # Local ephemeral dependencies, build outputs, and Git metadata (all in .gitignore)
  '''(?i)node_modules/''',
  '''(?i)\.next/''',
  '''(?i)dist/''',
  '''(?i)\.git/''',

  # Gitignored offline development signing key (per AGENTS.md Rule 4: never committed to VCS)
  '''(?i)keys/private\.pem$''',

  # Individually Justified False Positive 1: Credential Vault Masking Unit Tests
  # File: orbitox/packages/plugin-engine/src/security/credential-vault.spec.ts
  # Justification: Validates that CredentialVault.maskSecret correctly preserves public provider prefixes
  # (AWS AKIA..., GitHub ghp_...) while completely redacting secret bodies in production logs.
  '''(?i)orbitox/packages/plugin-engine/src/security/credential-vault\.spec\.ts$''',

  # Individually Justified False Positive 2: Log Redaction Hardening Tests
  # File: projects/external-os/restaurant-os/scripts/test-phase6c-stage-a.js
  # Justification: Validates that redactSensitiveData() algorithmically catches and masks synthetic
  # Base64 tokens and sample test JWTs before writing to stdout.
  '''(?i)projects/external-os/restaurant-os/scripts/test-phase6c-stage-a\.js$''',

  # Individually Justified False Positive 3: Observability Security Audit
  # File: projects/external-os/restaurant-os/scripts/test-phase6a-observability.js
  # Justification: Integration test confirming recursive audit log sanitization of dummy bearer/order tokens.
  '''(?i)projects/external-os/restaurant-os/scripts/test-phase6a-observability\.js$''',

  # Individually Justified False Positive 4: Owner Self-Service Payment Encryption & Masking
  # File: projects/external-os/restaurant-os/scripts/test-owner-self-service.ts
  # Justification: Integration test verifying AES-256-GCM envelope encryption and prefix/suffix masking
  # (e.g. rzp_live...91zP) of tenant payment gateway configurations.
  '''(?i)projects/external-os/restaurant-os/scripts/test-owner-self-service\.ts$''',

  # Individually Justified False Positive 5: POS Station Token Hardware Binding & Rejection
  # File: scripts/test-phase6-1-identity-lifecycle.js
  # Justification: Security test verifying rejection and cross-branch isolation of hardware station tokens.
  '''(?i)scripts/test-phase6-1-identity-lifecycle\.js$''',

  # Individually Justified False Positive 6: KDS Adversarial Attack & Replay Resistance Suite
  # File: scripts/test-kds-security-adversarial.js
  # Justification: Penetration testing harness verifying hardware-bound station secret verification
  # and rejecting forged station credentials.
  '''(?i)scripts/test-kds-security-adversarial\.js$'''
]

[[rules]]
id = "restaurantos-literal-bridge-secret"
description = "Banned legacy hardcoded bridge secret literal"
regex = '''dev_platform_secret_token_restaurantos_secure_32ch'''
tags = ["key", "bridge", "secret"]

